name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  OPENAI_API_KEY: ""
  PYTHONUNBUFFERED: "1"
  RATE_LIMIT_ENABLED: "false"
  ENFORCE_ACCESS_POLICY: "true"

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Bootstrap offline Chroma index (no OpenAI)
        run: python scripts/ci_bootstrap_db.py

      - name: CI smoke tests
        run: pytest tests/test_ci_smoke.py -v

      - name: Unit tests (answerability, calculation, RAG schema)
        run: |
          pytest \
            tests/test_answerability.py \
            tests/test_calculation.py \
            tests/test_rag_response.py \
            tests/test_retriever_strategies_compare.py \
            tests/test_access_policy.py \
            tests/test_auth_enforcement.py \
            -v

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8080
