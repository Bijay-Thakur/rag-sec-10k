# Build backend image for Cloud Run.
# Build contains no vector index. Semantic retrieval requires a separately
# verified real index at runtime; BM25 demo mode works without one.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - backend/Dockerfile
      - -t
      - us-central1-docker.pkg.dev/sec-insight-ai/cloud-run-source-deploy/sec-insight-api:latest
      - .

images:
  - us-central1-docker.pkg.dev/sec-insight-ai/cloud-run-source-deploy/sec-insight-api:latest

# PyTorch + sentence-transformers pip install needs headroom.
options:
  machineType: E2_HIGHCPU_8
timeout: 3600s
