# Build backend image for Cloud Run.
# Step 0 creates db/ on the build VM (db/ is gitignored and not uploaded).
steps:
  - name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        pip install --no-cache-dir "chromadb>=0.4.24,<0.6"
        python scripts/ci_bootstrap_db.py
        test -d db || (echo "db/ missing after bootstrap" >&2; exit 1)

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - backend/Dockerfile
      - -t
      - us-central1-docker.pkg.dev/sec-insight-ai/cloud-run-source-deploy/sec-insight-api:latest
      - .

images:
  - us-central1-docker.pkg.dev/sec-insight-ai/cloud-run-source-deploy/sec-insight-api:latest

# PyTorch + sentence-transformers pip install needs headroom.
options:
  machineType: E2_HIGHCPU_8
timeout: 3600s
